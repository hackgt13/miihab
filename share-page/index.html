<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiiHab</title>
<meta name="description" content="A milestone shared from MiiHab: rehab at home, in VR, with friends.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="MiiHab">
<meta property="og:title" content="A MiiHab milestone">
<meta property="og:description" content="Rehab that goes home with you: a Meta Quest, the AirPods you own, and friends in your corner.">
<style>
  :root { --sand-00:#FDFBF6; --sand-20:#F2EBDA; --cerulean-50:#2274A5; --cerulean-10:#EAF3F9; --jungle-10:#EDF8EE; --jungle-60:#2B6B31; --slate-50:#6B7EA4; --slate-70:#33456A; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--sand-20); color: var(--slate-70);
         font: 16px/1.5 "Nunito", ui-rounded, system-ui, -apple-system, sans-serif; }
  .card { width: min(560px, 100%); background: var(--sand-00); border-radius: 22px; padding: 32px; box-shadow: 0 1px 0 rgba(51,69,106,.08), 0 12px 32px rgba(51,69,106,.10); }
  .eyebrow { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--slate-50); display: flex; justify-content: space-between; gap: 12px; align-items: center; }
  .tag { background: var(--jungle-10); color: var(--jungle-60); border-radius: 999px; padding: 4px 12px; letter-spacing: .04em; text-transform: none; font-weight: 700; }
  .tag:empty { display: none; }
  h1 { font-size: clamp(22px, 5vw, 28px); line-height: 1.3; margin: 18px 0 8px; color: var(--slate-70); }
  p { margin: 0; color: var(--slate-50); }
  .brand { margin-top: 28px; padding-top: 18px; border-top: 1px solid var(--cerulean-10); display: flex; gap: 10px; align-items: center; font-weight: 800; color: var(--cerulean-50); }
  .mark { width: 28px; height: 28px; border-radius: 8px; background: var(--cerulean-50); color: var(--sand-00); display: grid; place-items: center; font-size: 16px; }
</style>
</head>
<body>
  <main class="card">
    <div class="eyebrow"><span>Worth sharing</span><span class="tag" id="fact"></span></div>
    <h1 id="line">Showing up for recovery, one day at a time.</h1>
    <p>Shared from MiiHab: rehab at home, in VR, with friends in your corner.</p>
    <div class="brand"><span class="mark">m</span>MiiHab</div>
  </main>
  <script>
    // The words travel in the link the patient chose to share; nothing else about them does. Text only, never HTML.
    const q = new URLSearchParams(location.search), clip = (s, n) => (s || "").slice(0, n);
    if (q.get("t")) document.getElementById("line").textContent = clip(q.get("t"), 240);
    document.getElementById("fact").textContent = clip(q.get("f"), 60);
  </script>
</body>
</html>
